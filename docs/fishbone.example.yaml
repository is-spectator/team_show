# 项目鱼骨图数据结构 v1
#
# 一份文件 = 一个项目的一张鱼骨图。
#   鱼尾 = project.start，鱼头 = project.end + project.goal
#   骨头 = milestones（里程碑），主干上的亮点 = updates（进展）
#
# 约定：
#   - 日期一律写成带引号的 "YYYY-MM-DD"（不加引号有些 YAML 解析器会转成时间对象）
#   - id 在同一个文件里唯一即可，界面新建时自动生成 m<时间戳> / u<时间戳>
#   - 允许增加自定义字段，界面会原样保留，导出时一起带出
#   - 与 fishbone.example.json 结构完全一致，可互相转换；校验规则见 fishbone.schema.json

version: 1

project:
  id: cs-platform-2
  name: 智能客服平台 2.0
  owner: 陈思
  members: [刘洋, 赵敏, 郑雨, 周航]
  start: "2026-08-01"            # 鱼尾：项目开始
  end: "2026-12-20"              # 鱼头：项目结束
  status: on_track               # on_track 正常 | at_risk 有风险 | delayed 已延期 | done 已完成
  goal:                          # 写在鱼头下面的最终目标
    title: 全量发布
    description: 覆盖 80% 常见咨询，人工转接率下降 30%

# ---------- 骨头：里程碑 ----------
# status 决定骨头的画法：
#   done        已完成  → 实线深色骨头，画在 done_date 的位置
#   in_progress 进行中  → 蓝色虚线骨头，画在 planned_date
#   planned     计划中  → 灰色虚线骨头，画在 planned_date
#   delayed     已延期  → 红色虚线骨头，画在 planned_date
milestones:
  - id: m1
    title: 需求评审通过             # 写在骨头尖的卡片上
    planned_date: "2026-08-15"
    done_date: "2026-08-15"        # 只有 done 才需要；不填时界面按保存当天补上
    status: done
    owner: 陈思
    summary: PRD 评审通过，确定覆盖 80% 常见咨询的目标与验收口径。
    side: auto                     # auto 上下交替 | up 朝上 | down 朝下
    attachments:                   # 里程碑的交付物，点开骨头可查看、增删
      - title: 智能客服 2.0 · PRD
        url: https://example.com/docs/prd
        type: doc                  # doc 文档 | sheet 表格 | slide 演示 | design 设计稿 | link 链接 | file 文件

  - id: m2
    title: 技术方案定稿
    planned_date: "2026-09-05"
    done_date: "2026-09-05"
    status: done
    owner: 刘洋
    summary: 检索增强架构评审通过，拆分为检索、生成、评测三个模块。
    side: auto
    attachments:
      - title: 技术方案：检索增强架构
        url: https://example.com/docs/arch
        type: doc
      - title: 架构评审记录
        url: https://example.com/docs/arch-review
        type: doc

  - id: m3
    title: 召回率达标 91%
    planned_date: "2026-10-25"
    done_date: "2026-10-20"        # 比计划提前 5 天完成
    status: done
    owner: 赵敏
    summary: 检索召回率从 84% 提升到 91%，提前 5 天超过 90% 的阶段目标。
    side: auto
    attachments:
      - title: 召回率评测报告
        url: https://example.com/sheets/recall
        type: sheet

  - id: m4
    title: 核心开发完成
    planned_date: "2026-11-02"
    status: in_progress
    owner: 刘洋
    summary: 检索、生成、评测三个模块完成开发并合入主干。
    side: auto
    attachments: []

  - id: m5
    title: 灰度上线
    planned_date: "2026-11-15"
    status: planned
    owner: 陈思
    summary: 在 2 个客服组灰度，观察自助解决率与转人工率。
    side: auto
    attachments:
      - title: 灰度发布 Checklist
        url: https://example.com/docs/gray-checklist
        type: doc

  - id: m6
    title: 效果复盘
    planned_date: "2026-12-05"
    status: planned
    owner: 陈思
    summary: ""
    side: auto
    attachments: []

