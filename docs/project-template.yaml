# 项目展示 · 项目数据模板 v2
#
# 一份文件 = 一个项目 = 一条鱼。在项目展示页点「导入项目」，粘贴这份内容（或 JSON 版本）即可创建项目。
#   鱼尾 = start，鱼头 = end + goal
#   items 里每一条长一根鱼骨：
#     type: milestone  里程碑 → 实线鱼骨（日期在今天之后的画成浅灰实线，表示计划）
#     type: update     进展   → 虚线鱼骨
#
# 约定：
#   - 日期写成带引号的 "YYYY-MM-DD"
#   - 除了 name / start / end，其他字段都可以不填
#   - links 是附带的文档链接，可以有多条

name: 智能客服平台 2.0
owner: 陈思
members: [刘洋, 赵敏, 郑雨, 周航]
start: "2026-08-01"            # 鱼尾：项目开始
end: "2026-12-20"              # 鱼头：项目交付
status: on_track               # on_track 按计划推进 | at_risk 需要关注 | delayed 有延期 | done 已交付
fish: 胡子鲶                    # 鱼的样子：蓝鳍鱼 | 胡子鲶 | 尖嘴鱼 | 河豚 | 长吻鱼 | 青鱼 | 灰鲫鱼（不填就自动轮换）
rider: 自行车                  # 进度上的小人：自行车 | 小轿车 | 跑步的人 | 滑板车 | 滑板（已交付时自动换成举旗冲线）
goal: 全量发布                  # 写在鱼头下面，几个字
goal_detail: 覆盖 80% 常见咨询，人工转接率下降 30%

